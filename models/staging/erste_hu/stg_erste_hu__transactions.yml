models:
  - name: stg_erste_hu__transactions
    columns:
      - name: txn_key
        data_tests:
          - not_null
          - unique
      - name: account_alias
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['EUR', 'HUF']