[project]
name = "finance-data-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
analysis = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "seaborn>=0.13.2",
]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project is not installed as a package, so make `import pipelines` work from the project root
pythonpath = ["."]
# Warnings fail tests unless a test expects them (same idea as strict mode for the pipeline)
filterwarnings = ["error"]
